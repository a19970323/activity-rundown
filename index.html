<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026電商激勵活動 - 行程檢視</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        [v-cloak] { display: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans p-4 md:p-8">
    <div id="app" v-cloak class="max-w-7xl mx-auto">
        
        <!-- 頂部資訊區 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-600">
            <h1 class="text-3xl font-bold text-gray-800">2026電商激勵活動 行程看板</h1>
            <div class="mt-4 md:mt-0 flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-6">
                <div v-if="errorMsg" class="text-red-500 font-bold text-sm bg-red-100 p-2 rounded">{{ errorMsg }}</div>
                <div class="flex items-center space-x-2 bg-blue-50 px-4 py-2 rounded">
                    <span class="font-bold text-gray-600">目前時間 (台北):</span>
                    <span class="text-2xl text-blue-700 font-mono font-bold">{{ currentTimeString }}</span>
                </div>
                <div class="flex flex-col">
                    <label class="text-xs text-gray-500 font-bold mb-1">測試模擬時間 (活動當日請清空此欄位)</label>
                    <input type="time" v-model="mockTime" @change="updateTime" class="border border-gray-300 rounded p-1 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <!-- 一、活動流程表 -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold border-b-2 border-gray-300 pb-2 mb-6 flex items-center">
                <span class="bg-blue-600 w-2 h-6 mr-2"></span> 一、活動流程表
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- 完成區塊 -->
                <div class="bg-white rounded-lg shadow overflow-hidden border-t-4 border-gray-400 opacity-80">
                    <div class="bg-gray-100 p-3 font-bold text-center text-gray-600">完成 (過去半小時)</div>
                    <div class="p-4 space-y-4 max-h-[600px] overflow-y-auto scrollbar-hide">
                        <div v-if="eventsCompleted.length === 0" class="text-gray-400 text-center py-8">無活動紀錄</div>
                        <div v-for="(ev, idx) in eventsCompleted" :key="'c'+idx" class="border-l-4 border-gray-400 pl-4 py-1">
                            <div class="text-sm text-gray-500 font-mono">{{ ev.time }}</div>
                            <div class="font-bold text-lg text-gray-700">{{ ev.item }}</div>
                            <div class="text-sm mt-1 text-gray-500 whitespace-pre-wrap">{{ ev.content }}</div>
                        </div>
                    </div>
                </div>

                <!-- 現在區塊 -->
                <div class="bg-white rounded-lg shadow-xl overflow-hidden border-t-4 border-green-500 transform md:scale-105 z-10">
                    <div class="bg-green-100 p-3 font-bold text-center text-green-800 text-lg">現在 (正在進行或未來一小時內)</div>
                    <div class="p-4 space-y-4 max-h-[600px] overflow-y-auto scrollbar-hide">
                        <div v-if="eventsCurrent.length === 0" class="text-gray-400 text-center py-8">無活動紀錄</div>
                        <div v-for="(ev, idx) in eventsCurrent" :key="'cur'+idx" class="border-l-4 border-green-500 pl-4 py-2 bg-green-50 rounded-r-lg">
                            <div class="text-sm text-green-600 font-mono font-bold">{{ ev.time }}</div>
                            <div class="font-bold text-xl text-green-800">{{ ev.item }}</div>
                            <div class="text-md mt-1 text-green-900 whitespace-pre-wrap">{{ ev.content }}</div>
                        </div>
                    </div>
                </div>

                <!-- 準備區塊 -->
                <div class="bg-white rounded-lg shadow overflow-hidden border-t-4 border-blue-400">
                    <div class="bg-blue-50 p-3 font-bold text-center text-blue-700">準備 (未來一至兩小時)</div>
                    <div class="p-4 space-y-4 max-h-[600px] overflow-y-auto scrollbar-hide">
                        <div v-if="eventsUpcoming.length === 0" class="text-gray-400 text-center py-8">無活動紀錄</div>
                        <div v-for="(ev, idx) in eventsUpcoming" :key="'u'+idx" class="border-l-4 border-blue-400 pl-4 py-1">
                            <div class="text-sm text-blue-500 font-mono">{{ ev.time }}</div>
                            <div class="font-bold text-lg text-gray-800">{{ ev.item }}</div>
                            <div class="text-sm mt-1 text-gray-600 whitespace-pre-wrap">{{ ev.content }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 二、工作人員執行表
